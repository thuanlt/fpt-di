name: fpt-ddi-batch-runner
description: |
  Skill fpt-ddi-batch-runner — submit & theo dõi batch job, cảnh báo khi xong.
  Workflow chạy thật: tạo JSONL → POST /v1/batch → poll status tới completed/failed.
agents:
  runner:
    description: "Submit và poll batch job."

steps:
  - id: make-job
    tool: bash
    toolInput:
      command: "printf '{\"prompt\":\"tóm tắt FPT DDI\"}\\n{\"prompt\":\"viết slogan data residency Việt Nam\"}\\n' > /tmp/skill-batch.jsonl && wc -l /tmp/skill-batch.jsonl"

  - id: submit-job
    dependsOn: [make-job]
    tool: bash
    toolInput:
      command: "curl -s -X POST http://backend:3000/v1/batch -F 'model=PhoGPT-4B' -F 'max_tokens=128' -F 'file=@/tmp/skill-batch.jsonl'"

  - id: poll-status
    dependsOn: [submit-job]
    tool: bash
    toolInput:
      command: |
        JOB_ID=$(curl -s http://backend:3000/v1/batch | python3 -c "import sys,json;d=json.load(sys.stdin);print(d['data'][0]['id'] if d['data'] else '')")
        if [ -z "$JOB_ID" ]; then echo "no job found"; exit 1; fi
        for i in $(seq 1 15); do
          STATUS=$(curl -s http://backend:3000/v1/batch/$JOB_ID | python3 -c "import sys,json;print(json.load(sys.stdin)['data']['status'])")
          echo "poll $i: $STATUS"
          if [ "$STATUS" = "completed" ] || [ "$STATUS" = "failed" ]; then break; fi
          sleep 2
        done

  - id: download-output
    dependsOn: [poll-status]
    tool: bash
    toolInput:
      command: |
        JOB_ID=$(curl -s http://backend:3000/v1/batch | python3 -c "import sys,json;d=json.load(sys.stdin);print(d['data'][0]['id'] if d['data'] else '')")
        curl -s "http://backend:3000/v1/batch/$JOB_ID/output" | head -c 1500

  - id: summary
    dependsOn: [download-output]
    tool: bash
    toolInput:
      command: "echo 'fpt-ddi-batch-runner done — job đã submit, poll tới xong, output tải được'"
