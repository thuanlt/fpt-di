services:
  web:
    image: caddy:2-alpine
    ports:
      - "5173:5173"
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    volumes:
      - ./Caddyfile.preview.vibeflow:/etc/caddy/Caddyfile:ro
      - ./partner-console:/srv:ro
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env.preview
    environment:
      - PORT=3000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - BATCH_STORAGE_ROOT=/data/batch
      - NODE_ENV=production
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_DB=ddi
      - PG_USER=ddi
      - PG_PASSWORD=ddi
      - KEYS_BACKEND=postgres
      - ENDPOINTS_BACKEND=postgres
      - FPT_DDI_INFERENCE_URL=http://localhost:3000
      - FPT_DDI_INFERENCE_TIMEOUT_MS=30000
      - FPT_DDI_BATCH_CONCURRENCY=4
      - BYOM_STORAGE_ROOT=/data/byom
      - BYOM_HF_TIMEOUT_MS=600000
      - BYOM_WORKER_POLL_MS=3000
      - BYOM_WORKER_CONCURRENCY=2
      - DOCUMENTS_STORAGE_ROOT=/data/documents
      - DOCUMENTS_WORKER_POLL_MS=2000
      - DOCUMENTS_WORKER_CONCURRENCY=2
      - VLLM_BASE_URL=http://vllm-adapter:8000
      - ZENFLOW_BIN=/usr/local/bin/zenflow
      - ZENFLOW_WORKFLOWS_DIR=/app/zenflow-workflows
      - ZENFLOW_WORKDIR_ROOT=/tmp/zenflow-runs
      - ZENFLOW_MODEL=google/gemini-2.0-flash
    volumes:
      - batchdata:/data/batch
      - byomdata:/data/byom
      - docsdata:/data/documents
    depends_on:
      - redis
      - postgres

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redisdata:/data

  vllm-adapter:
    build:
      context: .
      dockerfile: Dockerfile.vllm-adapter
    environment:
      - PORT=8000
      - NODE_ENV=production

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ddi
      POSTGRES_PASSWORD: ddi
      POSTGRES_DB: ddi
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ddi -d ddi"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  batchdata: {}
  redisdata: {}
  pgdata: {}
  byomdata: {}
  docsdata: {}