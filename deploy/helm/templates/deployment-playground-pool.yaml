{{- if .Values.playgroundPool.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-playground-pool
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    app.kubernetes.io/name: fpt-ddi
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: playground-pool
  annotations:
    ddi.fpt.vn/purpose: "O1 playground preview — 1 GPU luôn warm cho BYOM Try-in-Playground"
spec:
  replicas: {{ .Values.playgroundPool.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: playground-pool
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fpt-ddi
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: playground-pool
      annotations:
        ddi.fpt.vn/started-at: "{{ now | date "2006-01-02T15:04:05Z" }}"
    spec:
      {{- with .Values.image.pullSecret }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      {{- with .Values.playgroundPool.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: vllm
          {{- if .Values.playgroundPool.realVllm }}
          image: "{{ .Values.playgroundPool.image | default "vllm/vllm-openai:latest" }}"
          {{- else }}
          image: "{{ .Values.image.vllmAdapter }}"
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
          env:
            - name: PORT
              value: "8000"
            - name: NODE_ENV
              value: "production"
            - name: VLLM_SERVED_MODELS_DIR
              value: "{{ .Values.playgroundPool.servedModelsDir | default "/data/byom" }}"
            - name: VLLM_COLD_START_METRICS
              value: "true"
            {{- with .Values.playgroundPool.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- if .Values.playgroundPool.gpu.count }}
            requests:
              nvidia.com/gpu: {{ .Values.playgroundPool.gpu.count }}
              cpu: "{{ .Values.playgroundPool.resources.requests.cpu }}"
              memory: "{{ .Values.playgroundPool.resources.requests.memory }}"
            limits:
              nvidia.com/gpu: {{ .Values.playgroundPool.gpu.count }}
              cpu: "{{ .Values.playgroundPool.resources.limits.cpu }}"
              memory: "{{ .Values.playgroundPool.resources.limits.memory }}"
            {{- else }}
            {{- toYaml .Values.playgroundPool.resources | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: byom-weights
              mountPath: {{ .Values.playgroundPool.servedModelsDir | default "/data/byom" }}
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
      volumes:
        - name: byom-weights
          {{- if .Values.playgroundPool.weightsPvc }}
          persistentVolumeClaim:
            claimName: {{ .Values.playgroundPool.weightsPvc }}
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- end }}
