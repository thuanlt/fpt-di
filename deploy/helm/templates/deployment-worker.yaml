{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-worker
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    app.kubernetes.io/name: fpt-ddi
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fpt-ddi
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: worker
    spec:
      {{- with .Values.image.pullSecret }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: worker
          image: "{{ .Values.image.backend }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
            {{- if .Values.envSecret.create }}
            - secretRef:
                name: {{ .Values.envSecret.name | default "ddi-prod-env" }}
            {{- end }}
          env:
            - name: WORKER_MODE
              value: "{{ .Values.worker.WORKER_MODE }}"
            - name: PORT
              value: "3001"
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            - name: byom
              mountPath: /data/byom
            - name: batch
              mountPath: /data/batch
      volumes:
        - name: byom
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-byom
        - name: batch
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-batch
{{- end }}
