apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    app.kubernetes.io/name: fpt-ddi
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  NODE_ENV: "production"
  PG_HOST: "{{ .Values.postgres.host }}"
  PG_PORT: "5432"
  PG_DB: "{{ .Values.postgres.db }}"
  PG_USER: "{{ .Values.postgres.user }}"
  PG_SSLMODE: "{{ .Values.postgres.sslmode }}"
  REDIS_HOST: "{{ .Values.redis.host }}"
  REDIS_PORT: "6379"
  REDIS_DB: "{{ .Values.redis.db | default 0 }}"
  BATCH_STORAGE_ROOT: "/data/batch"
  BYOM_STORAGE_ROOT: "/data/byom"
  KEYS_BACKEND: "postgres"
  ENDPOINTS_BACKEND: "postgres"
  KEYS_ADMIN_REQUIRED: {{ .Values.keysAdminRequired | default "true" | quote }}
  FPT_DDI_INFERENCE_URL: "http://{{ .Release.Name }}-vllm-adapter:8000"
  WORKER_MODE: "all"
  {{- if not .Values.envSecret.create }}
  PG_PASSWORD: "{{ .Values.postgres.password | default "ddi" }}"
  REDIS_PASSWORD: "{{ .Values.redis.password | default "ddi" }}"
  {{- end }}
